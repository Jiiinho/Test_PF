<script>
/* ================================================================
   화면 그리기 — 고치지 마세요
   (위의 ② PRODUCTS · ③ SETTINGS 내용을 읽어서 화면을 만들어요)
   · 내 컴퓨터에서 열거나 사이트 주소 끝에 ?점검 을 붙이면 '공개 전 점검' 상자가 떠요.
   · 손님 화면에서는 [대괄호]로 남은 칸, 비어 있는 링크, 사진 자리 안내가 저절로 숨겨져요.
   ================================================================ */
(function () {
  'use strict';

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var errors = window.__setupErrors || [];

  function read(get) { try { return get(); } catch (e) { return undefined; } }
  var S = read(function () { return SETTINGS; });
  var P = read(function () { return PRODUCTS; });

  /* 관리자 미리보기: 내 컴퓨터(file://, localhost)에서 열었거나 주소 끝에 ?점검 · ?check 를 붙였을 때

    try {
      var q = new URLSearchParams(location.search);
      if (q.has('손님') || q.has('live')) return false;   /* 내 컴퓨터에서도 ?손님 을 붙이면 손님 화면 그대로 보여요 */
      if (q.has('점검') || q.has('check')) return true;
      if (location.protocol === 'file:') return true;
      return /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    } catch (e) { return false; }
  })();

  /* ---------- 작은 도구들 ---------- */
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

  function has(v) { return v != null && String(v).trim() !== ''; }
  function todo(v) { return /^\s*\[[^\[\]]*\]\s*$/.test(String(v == null ? '' : v)); }   /* 값 전체가 [대괄호] = 아직 안 채움 */
  function show(v) { return has(v) && (PREVIEW || !todo(v)); }                              /* 화면에 보여 줄 값인지 */
  function filled(v) { return has(v) && !todo(v); }
  function urlOk(v) { return has(v) && String(v).indexOf('[') === -1 && norm(v) !== ''; }    /* 주소는 [ 가 하나라도 있거나 위험한 형식이면 안 써요 */
  function unsafeUrl(v) { return has(v) && String(v).indexOf('[') === -1 && norm(v) === ''; } /* 채웠지만 막힌 주소 (공개 전 점검에서 알려 줘요) */
  function txt(v) {
    var s = esc(v).replace(/\n/g, '<br>');
    return PREVIEW && todo(v) ? '<mark class="todo">' + s + '</mark>' : s;
  }
  function isOn(v) { return v === true || String(v).trim() === 'true'; }
  function obj(v) { return v && typeof v === 'object' ? v : {}; }
  function list(v) { return Array.isArray(v) ? v : (has(v) ? [v] : []); }
  function trim(v) { return String(v == null ? '' : v).trim(); }
  function file(name) { return 'images/' + encodeURI(trim(name)); }
  function norm(url) {
    url = trim(url).replace(/[\u0000-\u0020\u007f-\u009f\u200b-\u200f\u2028\u2029\ufeff]+/g, '');   /* 주소 안 공백·보이지 않는 글자 제거 */
    if (/^(https?:|mailto:|tel:)/i.test(url)) return url;
    if (/^[a-z][a-z0-9+\-]*:/i.test(url)) return '';   /* javascript: 같은 위험한 형식은 링크로 만들지 않아요 */
    if (/^(\/|\.\.?\/|#)/.test(url) || /^[^\/]+\.html?([?#].*)?$/i.test(url)) return url;   /* 사이트 안의 페이지 (예: terms.html) */
    return 'https://' + url.replace(/^\/+/, '');
  }
  function mq(q) { return !!(window.matchMedia && window.matchMedia(q).matches); }
  function li(x) { return x ? '<li>' + x + '</li>' : ''; }
  function uniq(a) { var o = []; a.forEach(function (x) { if (x && o.indexOf(x) === -1) o.push(x); }); return o; }
  function tagsOf(v) { return filled(v) ? uniq(String(v).split(/\s*[,，·\/|]\s*/).map(trim)) : []; }   /* "집들이 선물, 생일 선물" → 두 개 */
  function won(v) { if (typeof v === 'number') return v; var d = trim(v).replace(/[^0-9]/g, ''); return d ? parseInt(d, 10) : NaN; }
  function ratingOk(v) { var r = trim(v).replace(',', '.'); return filled(v) && /^\d(\.\d{1,2})?$/.test(r) && +r > 0 && +r <= 5; }

  var CHEV = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';
  var EXT = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11 11 5M6.5 5H11v4.5"/></svg>';
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2.8l2.76 5.6 6.18.9-4.47 4.36 1.06 6.15L12 16.9l-5.53 2.91 1.06-6.15L3.06 9.3l6.18-.9z"/></svg>';
  var ICON = {

    x: icon('<path d="M6 6l12 12M18 6 6 18"/>'),
    share: icon('<path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/>'),
    gift: icon('<rect x="3.5" y="8.5" width="17" height="12" rx="1"/><path d="M3.5 12.5h17M12 8.5v12"/><path d="M12 8.5C10.4 4.9 6.4 4.6 6.4 6.9c0 1.4 2.4 1.6 5.6 1.6zM12 8.5c1.6-3.6 5.6-3.9 5.6-1.6 0 1.4-2.4 1.6-5.6 1.6z"/>'),

    send: icon('<path d="M20.5 3.5 3.5 10.6l6.8 2.6 2.6 6.8z"/><path d="M10.3 13.2 15 8.5"/>'),
    spark: icon('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M6.3 17.7l2.5-2.5M15.2 8.8l2.5-2.5"/>')
  };

  var toastTimer;
  /* 창·메뉴가 열려 뒤 화면을 멈출 때, PC 스크롤바가 사라진 폭만큼 채워 화면이 옆으로 밀리지 않게 해요 */
  function lockPage(on) {
    var de = document.documentElement;
    if (on && !de.classList.contains('is-locked')) {
      var sb = (window.innerWidth || 0) - de.clientWidth;
      if (sb > 0) document.body.style.paddingRight = sb + 'px';

    de.classList.toggle('is-locked', !!on);
  }
  function toast(msg) {
    toastEl.textContent = msg;
    /* 상품 창 안에서는 알림이 구매 버튼을 가리지 않게, 버튼 줄 바로 위에 띄워요 */
    var bar = toastEl.parentNode && toastEl.parentNode !== document.body ? toastEl.parentNode.querySelector('.pv__cta') : null,
      barTop = bar ? bar.getBoundingClientRect().top : 0, vh = window.innerHeight || 0;

  }

  function errorBox(where, err) {
    var e = err || (errors.length ? errors[0] : null);
    return '<div class="setup-error" role="alert"><b>⚠ ' + esc(where) + '에 고칠 곳이 있어요</b>' +

  }

  /* ---------- 사진 자리 ---------- */
  var missing = [];    /* 불러오지 못한 사진·영상 (공개 전 점검에 보여요) */
  var optional = [];   /* 없어도 손님 화면에서 티가 안 나는 사진 (상품 추가 사진) */
  function ph(label, size, fname, small) {
    return '<div class="ph' + (small ? ' ph--sm' : '') + '" role="img" aria-label="' + esc(label) + '"><span class="ph__in"><b>' + esc(label) + '</b>' +

  window.__ph = function (img) {
    var f = img.getAttribute('data-ph-file') || '';
    if (f.indexOf('  /  ') === -1) noteMissing(f);   /* 첫 화면 사진은 따로 하나씩 확인해요 */
    var host = img.parentNode && img.parentNode.tagName === 'PICTURE' ? img.parentNode : img;
    if (!host.parentNode) return;
    var drop = img.getAttribute('data-ph-drop');
    if (!PREVIEW && drop) {          /* 인스타 칸·브랜드 이야기·추가 사진: 손님 화면에선 자리째 숨겨요 */
      var box = host.closest ? host.closest(drop) : null;

        if (row && row.classList && row.classList.contains('gal__thumbs') &&
            [].filter.call(row.children, function (c) { return !c.hidden; }).length < 2) row.hidden = true;
        return;
      }

    d.innerHTML = PREVIEW
      ? ph(img.getAttribute('data-ph-label') || '사진 자리', img.getAttribute('data-ph-size') || '', img.getAttribute('data-ph-file') || '', img.hasAttribute('data-ph-small'))

  function pic(name, size, alt, label, w, h, opt) {

    if (!has(name)) return opt.drop && !PREVIEW ? '' : (PREVIEW ? ph(label, size, '', opt.small) : BLANK);
    return '<img src="' + esc(file(name)) + '" alt="' + esc(alt || '') + '" width="' + w + '" height="' + h + '"' + (opt.eager ? '' : ' loading="lazy"') + ' decoding="async"' +
      ' data-ph-label="' + esc(label) + '" data-ph-size="' + esc(size) + '" data-ph-file="images/' + esc(trim(name)) + '"' +

  }

  if (!S || typeof S !== 'object') {
    app.innerHTML = errorBox('③ 설정(SETTINGS)');
    return;

    if (has(AN.구글애널리틱스) && !GA_OK) W.push('③ 분석의 구글 애널리틱스 ID는 ' + c('G-') + '로 시작해요: ' + c(AN.구글애널리틱스));

    /* 사진·파일 */
    var mainMiss = missing.filter(function (f) { return optional.indexOf(f) === -1 && !/insta-|og-image|favicon|apple-touch|logo|\.mp4/i.test(f); });
    var otherMiss = missing.filter(function (f) { return mainMiss.indexOf(f) === -1; });

    var badge = (r.E.length ? '<span class="chk__n chk__n--err" title="꼭 고칠 것">' + r.E.length + '</span>' : '') +
